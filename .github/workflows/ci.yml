name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "numpy<2" pandas scikit-learn scipy matplotlib \
            "tensorflow-cpu>=2.13,<2.16" pytest ruff
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q
        env:
          # Quieter TensorFlow logs in CI output
          TF_CPP_MIN_LOG_LEVEL: "2"
